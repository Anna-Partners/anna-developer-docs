# Machine-checkable claims for docs/apps/app-manifest.md (design §5.3.1).
# Every literal is asserted against the published @anna-ai/app-schema bundle
# by scripts/check_claims.py — see that script's docstring for the contract.
# Schema 4 (@anna-ai/app-schema >= 0.33.0): permissions / host_capabilities
# are gone; the only capability declarations are credentials / agent.tools /
# storage.scopes (acl/capabilities.json closed vocabulary).
manifest_fields:
  - schema
  - required_executas
  - optional_executas
  - storage
  - system_prompt_addendum
  - user_message_prefix_template
  - tags
  - ui
  - dev
ui_manifest_fields:
  - host_api
  - browser_permissions
storage_scopes:
  - user
  - app
  - tool
storage_modes:
  - r
  - w
  - rw
