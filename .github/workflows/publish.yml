name: publish

# main-branch build + R2 publish + Nexus nudge (design §5.2).
# Secrets live ONLY here — ci.yml (fork PRs) never sees them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes: a queued run must not interleave uploads with a
# running one (the pointer flip must always point at a complete bundle).
concurrency:
  group: publish-developers-hub
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt boto3

      # Re-validate on main — belt and braces; required checks already ran on the PR.
      - run: python scripts/validate.py
      - run: python scripts/check_links.py
      - run: python scripts/build_bundle.py --out build/

      - name: Publish bundle to R2 (versioned keys, pointer flip last)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'anna-docs' }}
        run: python scripts/publish_bundle.py --bundle-dir build/
