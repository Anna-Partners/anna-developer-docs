name: ci

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs run all jobs — nothing here needs secrets (design §5.1).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # External links are checked but warn-only by design (flaky internet
      # must not block docs PRs) — only broken /developers/** links fail.
      - run: python scripts/check_links.py --external

  build-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_bundle.py --dry-run

  reference-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_reference.py
      # Drift-check against the *published* schema package, pinned in
      # .schema-version (bumped by Renovate when a new schema ships).
      - run: npm install --no-save "@anna-ai/app-schema@$(cat .schema-version)"
      - run: python scripts/check_reference_drift.py

  # P3 §5.3.1 — article claims asserted against the published schema bundle.
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install --no-save "@anna-ai/app-schema@$(cat .schema-version)"
      - run: python scripts/check_claims.py

  # P3 §5.3.2 — tagged doc samples executed against the pinned published CLI.
  samples-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          # @anna-ai/cli engines node>=22.
          node-version: "22"
      - run: pip install -r requirements.txt
      # npx's cold-cache install hangs forever on hosted runners; install the
      # pinned CLI locally (the pattern the other jobs use) and run its bin.
      - run: npm install --no-save "@anna-ai/cli@$(cat .cli-version)"
      - run: python scripts/run_samples.py
        env:
          ANNA_APP_CLI: node_modules/.bin/anna-app

  # P3 §9.2 — generated reference sections reject hand edits (regenerate-diff).
  reference-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install --no-save "@anna-ai/app-schema@$(cat .schema-version)"
      - run: python scripts/generate_reference.py --check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
